name: Daily Company Ingestion

# Runs once a day. GCIS's own confirmation says a well-formed
# $filter=Company_Setup_Date query works unauthenticated for both
# discovery (公司資料設立查詢) and full profile (公司登記基本資料-應用一) —
# no IP whitelist needed for this cadence. See blueprint Section 11,
# "Session 13 pre-work, 2026-08-12" correction entry.
#
# Cron is in UTC. 22:00 UTC = 06:00 Taipei time (UTC+8) the next day —
# gives GCIS's own systems overnight to finish processing the prior
# day's approvals before we ask for them.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingestion
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/run-ingest-daily.ts

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -X POST "https://api.resend.com/emails" -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "{\"from\":\"$EMAIL_FROM\",\"to\":\"$ALERT_EMAIL\",\"subject\":\"tw-leads-radar: Daily Company Ingestion FAILED\",\"html\":\"<p>Today's daily company ingestion job failed. Paid-tier customers rely entirely on this job for same-day-fresh data, with no buffer the way free tier's 30-day gate provides — if this isn't fixed quickly, it silently recreates the same kind of multi-day data gap already found and logged in architecture.md for 2026-08-01 to 2026-08-11.</p><p>Check the ingestion_runs table's most recent row for the logged error, or the GitHub Actions log for this run, to see what failed.</p>\"}"
