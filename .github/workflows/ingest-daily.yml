name: Daily Company Ingestion

# Runs once a day. GCIS's own confirmation says a well-formed
# $filter=Company_Setup_Date query works unauthenticated for both
# discovery (公司資料設立查詢) and full profile (公司登記基本資料-應用一) —
# no IP whitelist needed for this cadence. See blueprint Section 11,
# "Session 13 pre-work, 2026-08-12" correction entry.
#
# Cron is in UTC. 22:00 UTC = 06:00 Taipei time (UTC+8) the next day —
# gives GCIS's own systems overnight to finish processing the prior
# day's approvals before we ask for them.
#
# 2026-08-30: digest.yml now runs at 23:00 UTC (1 hour after this job
# starts) specifically so it never reads search_matches before this
# job's new matchAllSearches() call (added the same day) has finished
# updating them - see digest.yml's own schedule comment. If this job's
# start time ever changes, digest.yml's needs to move with it.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 2026-08-30: raised from 10 to 20 minutes after adding
    # retryRecentGaps() (up to 100 more live API calls) and
    # matchAllSearches() to the end of this run. A hard timeout kills
    # the process mid-execution rather than letting it exit gracefully -
    # the final `INSERT INTO ingestion_runs` never runs in that case, so
    # that day wouldn't even get a 'failed' status logged (though
    # GitHub's own failure detection still fires the Resend alert step
    # regardless). 20 minutes gives comfortable headroom above the
    # worst realistic case (existing runs typically finish in 1-4
    # minutes per Actions history; the new work adds at most a few more
    # minutes even on a bad day) without allowing runaway execution.
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingestion
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/run-ingest-daily.ts

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -X POST "https://api.resend.com/emails" -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "{\"from\":\"$EMAIL_FROM\",\"to\":\"$ALERT_EMAIL\",\"subject\":\"tw-leads-radar: Daily Company Ingestion needs a look\",\"html\":\"<p>Today's daily ingestion run either failed outright, or completed but found an unusually low success rate for fetching industry codes or region data for newly-discovered companies (below 50%, versus a normal ~100%).</p><p><strong>You likely don't need to do anything.</strong> Affected companies are automatically retried on every subsequent run for up to 14 days, so this typically self-heals within a few days once the underlying cause (usually a temporary GCIS API issue) resolves.</p><p>Only worth investigating further if this same alert keeps arriving for several days in a row without improving — check the ingestion_runs table's most recent row for the logged error, or the GitHub Actions log for this run.</p>\"}"
